<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mental Rotation Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lato','Helvetica Neue',Arial,sans-serif;background:#f0f0f0;color:#1a1a1a}

/* ── Pre-experiment overlay ─────────────────── */
#pre-experiment{position:fixed;inset:0;z-index:9999;background:#f0f0f0;
  display:flex;justify-content:center;align-items:center}
.pre-card{background:#fff;border-radius:10px;padding:48px 56px;max-width:460px;
  width:100%;text-align:center;box-shadow:0 2px 20px rgba(0,0,0,.10)}
.pre-card h2{font-size:22px;font-weight:700;margin-bottom:8px}
.pre-card p{font-size:15px;color:#777;margin-bottom:22px;line-height:1.5}
.pre-card label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:#888;margin-bottom:8px}
#pid-input{font-family:'Lato',sans-serif;font-size:20px;padding:10px 16px;
  width:200px;text-align:center;border:2px solid #ddd;border-radius:7px;
  outline:none;transition:border-color .2s;letter-spacing:.04em}
#pid-input:focus{border-color:#3a7bd5}
#pid-input.error{border-color:#e74c3c}
#start-btn{display:block;width:200px;margin:18px auto 0;padding:12px;
  font-family:'Lato',sans-serif;font-size:16px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;background:#3a7bd5;
  color:#fff;border:none;border-radius:7px;cursor:pointer;transition:background .2s}
#start-btn:hover{background:#2f67ba}
#load-msg{font-size:13px;color:#999;margin-top:14px;min-height:18px}

#demo-banner{position:fixed;bottom:0;left:0;right:0;z-index:10000;background:#fff3cd;
  color:#7a5b00;font-size:13px;text-align:center;padding:6px 12px;border-top:1px solid #f0d98a}

/* ── Main screen ────────────────────────────── */
#main{display:none;min-height:100vh}

/* ── Instructions ───────────────────────────── */
.inst-wrap{max-width:860px;margin:0 auto;padding:52px 32px 64px}
.inst-wrap p{font-size:16px;line-height:1.85;margin-bottom:14px}
.inst-wrap img.inst-img{display:block;max-width:100%;margin:24px auto}
.begin-row{text-align:center;margin-top:32px}
.feedback{font-size:20px;font-weight:700;margin-bottom:12px}
.feedback.right{color:#2e8b57}
.feedback.wrong{color:#c0392b}

/* ── Timer bar ──────────────────────────────── */
#timer-bar{position:sticky;top:0;z-index:100;background:#fff;
  border-bottom:2px solid #e0e0e0;
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 20px;gap:12px}
#part-label{font-size:14px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:#555;min-width:130px}
#timer-display{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;
  color:#222;transition:color .3s;min-width:70px;text-align:center}
#timer-display.warn{color:#e67e22}
#timer-display.urgent{color:#e74c3c}
#answered-count{font-size:14px;color:#888;min-width:120px;text-align:center}
.small-btn{padding:9px 22px;font-family:'Lato',sans-serif;font-size:14px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  background:#3a7bd5;color:#fff;border:none;border-radius:7px;
  cursor:pointer;transition:background .2s;white-space:nowrap}
.small-btn:hover{background:#2f67ba}

/* ── Items ──────────────────────────────────── */
.items{max-width:980px;margin:0 auto;padding:16px 20px 80px}
.item{background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.06);
  padding:16px 18px 14px;margin:14px 0;user-select:none;-webkit-user-select:none}
.item-num{font-size:13px;font-weight:700;color:#888;letter-spacing:.06em;margin-bottom:8px}
.item-hint{font-size:13px;color:#c0392b;min-height:18px;margin-top:6px;text-align:center}

/* Mode 1: separate target + option images */
.row{display:flex;align-items:stretch;gap:10px}
.target{flex:1 1 0;display:flex;align-items:center;justify-content:center;
  padding-right:14px;border-right:2px solid #333;margin-right:4px}
.opt{flex:1 1 0;display:flex;flex-direction:column;align-items:center;
  border:2.5px solid transparent;border-radius:8px;padding:6px;cursor:pointer;
  transition:background .12s,border-color .12s}
.opt:hover{background:#f3f7fd}
.row img{display:block;width:100%;height:auto;max-height:170px;object-fit:contain;
  pointer-events:none}
.opt .lbl{font-size:14px;font-weight:700;color:#555;margin-top:4px}

/* Mode 2: one image for the whole row, buttons underneath */
.row-img{display:block;width:100%;height:auto;pointer-events:none}
.btn-row{display:flex;justify-content:center;gap:12px;margin-top:10px}
.btn-row .opt{flex:0 0 auto;width:64px;padding:8px 0;border:2px solid #ccd;
  font-weight:700;font-size:16px;color:#333;text-align:center}

/* Pages within a part */
.page-nav{display:flex;align-items:center;justify-content:space-between;margin-top:24px}
.page-of{font-size:14px;color:#888}

/* Rows of figures on instruction pages */
.figs{display:flex;justify-content:center;gap:2%;margin:22px 0}
.figs img{display:block;flex:0 1 150px;min-width:0;width:150px;height:auto;pointer-events:none}
.inst-wrap .note{font-size:13px;color:#888;text-align:center;margin-top:-6px}
.inst-wrap h1{font-size:26px;text-align:center;margin-bottom:4px}

/* Selection states */
.opt.sel{background:rgba(58,123,213,.14);border-color:#3a7bd5}
.opt.sel .lbl,.btn-row .opt.sel{color:#1a5bbf}
.opt.key-right{border-color:#2e8b57;background:rgba(46,139,87,.12)}
.opt.key-wrong{border-color:#c0392b;background:rgba(192,57,43,.10)}
.opt.key-missed{border-color:#2e8b57;border-style:dashed}
.locked .opt{cursor:default}
.locked .opt:hover{background:inherit}

.missing{display:flex;align-items:center;justify-content:center;min-height:90px;width:100%;
  background:#fdecea;color:#c0392b;font-size:12px;border:1px dashed #c0392b;border-radius:6px;
  padding:6px;text-align:center;word-break:break-all}

/* ── Modal ──────────────────────────────────── */
#modal{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.35);display:none;
  align-items:center;justify-content:center}
#modal .card{background:#fff;border-radius:10px;padding:28px 32px;max-width:420px;text-align:center}
#modal p{font-size:16px;line-height:1.6;margin-bottom:20px}
#modal button{margin:0 6px}
.btn.secondary,.small-btn.secondary{background:#fff;color:#3a7bd5;border:2px solid #3a7bd5}
.btn.secondary:hover,.small-btn.secondary:hover{background:#eef4fc}

/* ── Break / End screens ────────────────────── */
.break-wrap{max-width:560px;margin:0 auto;padding:80px 24px;text-align:center}
.break-wrap h2{font-size:24px;margin-bottom:16px}
.break-wrap p{font-size:16px;color:#555;line-height:1.7;margin-bottom:10px}
.end-wrap{max-width:640px;margin:0 auto;padding:60px 24px;text-align:center}
.end-wrap h2{font-size:26px;margin-bottom:20px}
.score-card{background:#fff;border-radius:10px;padding:28px 32px;
  box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:24px;text-align:left}
.score-big{font-size:42px;font-weight:700;color:#3a7bd5;text-align:center;padding:8px 0 12px}
.score-card table{width:100%;border-collapse:collapse;font-size:15px}
.score-card td{padding:7px 4px;border-bottom:1px solid #f0f0f0;text-align:right}
.score-card td:first-child{color:#666;text-align:left}
.btn{padding:12px 36px;font-family:'Lato',sans-serif;font-size:16px;
  font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  background:#3a7bd5;color:#fff;border:none;border-radius:8px;
  cursor:pointer;transition:background .2s}
.btn:hover{background:#2f67ba}
.btn:disabled{opacity:.4;cursor:default}
kbd{display:inline-block;padding:2px 9px;font-family:monospace;font-size:13px;
  background:#f4f4f4;border:1px solid #ccc;border-bottom:2px solid #999;border-radius:4px}

/* ── Check mode ─────────────────────────────── */
.check-head{max-width:980px;margin:0 auto;padding:28px 20px 0}
.check-head h2{font-size:22px;margin-bottom:8px}
.check-head p{font-size:14px;color:#555;line-height:1.6}
.check-problem{color:#c0392b;font-weight:700}
</style>
</head>
<body>

<div id="pre-experiment">
  <div class="pre-card">
    <h2 id="pre-title">Mental Rotation Test</h2>
    <p id="pre-sub"></p>
    <label for="pid-input">Participant ID</label>
    <input id="pid-input" type="text" placeholder="e.g. P001" autocomplete="off" spellcheck="false">
    <button id="start-btn">Begin</button>
    <div id="load-msg"></div>
  </div>
</div>

<div id="main">
  <div id="timer-bar" style="display:none">
    <span id="part-label"></span>
    <span id="timer-display"></span>
    <span id="answered-count"></span>
    <button class="small-btn" id="submit-btn">Submit Part &rarr;</button>
  </div>
  <div id="content"></div>
</div>

<div id="modal"><div class="card">
  <p id="modal-text"></p>
  <button class="small-btn secondary" id="modal-no">Keep working</button>
  <button class="small-btn" id="modal-yes">Submit</button>
</div></div>

<!-- Your real test lives in config.js (and the stimuli folder it points to).
     Neither is committed to git. If config.js is missing, the demo version
     with placeholder pictures is loaded instead. -->
<script src="config.js"></script>
<script>
  if (!window.MRT_CONFIG) document.write('<script src="demo/config.js"><\/script>');
</script>

<script>
/* ════════════════════════════════════════════════════════════════════
   Mental rotation task engine.
   Contains no test content: every item, answer and instruction comes
   from MRT_CONFIG (config.js). See README.md for the config format.
   ════════════════════════════════════════════════════════════════════ */

const CFG = Object.assign({
  title: 'Mental Rotation Test',
  taskName: 'mentalrotation',      // "task" field in the Qualtrics message, and CSV filename
  stimuliPath: 'stimuli/',
  letters: 'ABCD',                 // one letter per answer option
  correctPerItem: 2,               // how many options are correct in each item
  maxSelections: 2,                // most options a participant may pick per item
  partSeconds: 180,
  warnAtSeconds: 60,
  urgentAtSeconds: 30,
  confirmEarlySubmit: true,
  showScoreAtEnd: true,
  instructions: [],
  practice: [],
  parts: [],
  breakHtml: '<p>You may take a short break.</p>',
}, window.MRT_CONFIG || {});

/* ── URL parameters (same as the paper folding task) ───────────────
   ?pid=K7M2QX&session=1&embedded=1
   - pid:      participant ID (skips the manual entry screen)
   - session:  e.g. 1 = pre, 2 = post (copied into the data)
   - embedded: "1" = send results to the Qualtrics page via postMessage
   - check:    "1" = answer-key check view (only on your own computer) */
const urlParams = new URLSearchParams(location.search);
const URL_PID  = (urlParams.get('pid') || '').trim();
const EMBEDDED = urlParams.get('embedded') === '1';
const SESSION  = (urlParams.get('session') || '').trim();
const IS_LOCAL = location.protocol === 'file:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
const CHECK    = urlParams.get('check') === '1' && IS_LOCAL;

const $ = id => document.getElementById(id);
const content = $('content'), timerBar = $('timer-bar');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mm_ss = s => Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
const src = f => /^(data:|https?:|\/)/.test(f) ? f : CFG.stimuliPath + f;
const allItems = () => CFG.parts.flatMap((p, pi) => p.items.map(it => ({ ...it, _part: pi + 1 })));
const keyOf = it => [].concat(it.answer || []).map(s => String(s).toUpperCase()).sort().join('');

/* ── State ───────────────────────────────────── */
let pid = '', sessionStart = '';
let partIdx = 0, partStartMs = 0, timerInt = null, timerSec = 0;
let sel = {};          // item id -> Set of letters currently selected
let meta = {};         // item id -> {first_ms, last_ms, changes}
let allData = [];
let practiceData = [];

/* ── Image preloading ────────────────────────── */
function imagesFor(it){ return it.image ? [it.image] : [it.target, ...(it.options || [])]; }
function preloadAll(){
  const instFiles = CFG.instructions.flatMap(pg => [pg.image, ...(pg.blocks || []).flatMap(b => b.figures || [])]);
  const files = [...new Set([...instFiles, ...[...CFG.practice, ...allItems()].flatMap(imagesFor)].filter(Boolean))];
  let done = 0; const missing = [];
  return Promise.all(files.map(f => new Promise(res => {
    const im = new Image();
    im.onload  = () => { done++; showLoad(done, files.length); res(); };
    im.onerror = () => { done++; missing.push(f); showLoad(done, files.length); res(); };
    im.src = src(f);
  }))).then(() => missing);
}
function showLoad(d, n){ const m = $('load-msg'); if(m) m.textContent = d < n ? `Loading pictures… ${d} / ${n}` : ''; }

/* ── Rendering one item ──────────────────────── */
function imgTag(f, cls){
  // onerror swaps in a red box naming the missing file, so setup mistakes are obvious.
  return `<img class="${cls||''}" src="${esc(src(f))}" alt="" draggable="false"
           onerror="this.outerHTML='<div class=missing>Missing picture:<br>${esc(src(f)).replace(/'/g,'')}</div>'">`;
}
function itemHtml(it, label){
  const L = CFG.letters.split('');
  let body;
  if (it.image) {
    body = `${imgTag(it.image, 'row-img')}
      <div class="btn-row">${L.map(l => `<div class="opt" data-l="${l}">${l}</div>`).join('')}</div>`;
  } else {
    body = `<div class="row">
      <div class="target">${imgTag(it.target)}</div>
      ${L.map((l, i) => `<div class="opt" data-l="${l}">${imgTag((it.options||[])[i] || '')}<span class="lbl">${l}</span></div>`).join('')}
    </div>`;
  }
  return `<div class="item" data-id="${esc(it.id)}">
    ${label ? `<div class="item-num">${esc(label)}</div>` : ''}${body}
    <div class="item-hint"></div></div>`;
}

// Click handling shared by practice and test items.
function wireItem(el, store, onChange){
  el.querySelectorAll('.opt').forEach(o => o.addEventListener('click', () => {
    if (el.classList.contains('locked')) return;
    const id = el.dataset.id, l = o.dataset.l;
    const s = store[id] || (store[id] = new Set());
    const hint = el.querySelector('.item-hint');
    hint.textContent = '';
    if (s.has(l)) s.delete(l);
    else if (s.size >= CFG.maxSelections) {
      hint.textContent = `You can choose up to ${CFG.maxSelections}. Click a chosen figure again to unselect it.`;
      return;
    } else s.add(l);
    o.classList.toggle('sel', s.has(l));
    if (onChange) onChange(id);
  }));
}

function showKey(el, it, chosen){
  const key = keyOf(it);
  el.classList.add('locked');
  el.querySelector('.item-hint').textContent = '';
  el.querySelectorAll('.opt').forEach(o => {
    const l = o.dataset.l, isKey = key.includes(l), picked = chosen && chosen.has(l);
    o.classList.remove('sel');
    if (picked && isKey) o.classList.add('key-right');
    else if (picked) o.classList.add('key-wrong');
    else if (isKey) o.classList.add(chosen ? 'key-missed' : 'key-right');
  });
}

/* ── Instructions & practice ─────────────────── */
let instIdx = 0;
function showInstructions(){ timerBar.style.display = 'none'; instIdx = 0; showInstPage(); }

function showInstPage(){
  const pages = CFG.instructions;
  if (instIdx >= pages.length) return startPart(0);
  const pg = pages[instIdx];
  const last = instIdx === pages.length - 1;
  if (pg.practice) return showPractice(pg, last);

  const nextLabel = last ? beginLabel() : 'Next &rarr;';
  content.innerHTML = `<div class="inst-wrap">${pg.html || ''}
    ${pg.image ? imgTag(pg.image, 'inst-img') : ''}
    ${blocksHtml(pg.blocks)}
    <div class="begin-row">
      ${instIdx > 0 ? '<button class="btn secondary" id="back-btn">&larr; Back</button> ' : ''}
      <button class="btn" id="next-btn">${nextLabel}</button></div></div>`;
  scrollTo(0, 0);
  if ($('back-btn')) $('back-btn').onclick = () => { instIdx--; showInstPage(); };
  const go = () => { instIdx++; last ? startPart(0) : showInstPage(); };
  last ? onceSpaceOrClick($('next-btn'), go) : ($('next-btn').onclick = go);
}

// Instruction page content: a list of {html: "..."} and {figures: ["a.png", ...]} blocks, in order.
function blocksHtml(blocks){
  return (blocks || []).map(b => b.figures
    ? `<div class="figs">${b.figures.map(f => imgTag(f)).join('')}</div>`
    : (b.html || '')).join('');
}
function beginLabel(){
  return CFG.beginLabel || `Begin ${esc(CFG.parts.length > 1 ? (CFG.parts[0].label || 'Part One') : 'the test')} &rarr;`;
}

function showPractice(pg, last){
  const ids = [].concat(pg.practice);
  const items = ids.map(id => CFG.practice.find(p => String(p.id) === String(id))).filter(Boolean);
  const store = {};
  content.innerHTML = `<div class="inst-wrap">${pg.html || ''}${blocksHtml(pg.blocks)}
    <div id="prac">${items.map(it => itemHtml(it, it.label || '')).join('')}</div>
    <div id="prac-fb"></div>
    <div class="begin-row"><button class="btn" id="check-btn" disabled>Check my answer &rarr;</button></div></div>`;
  scrollTo(0, 0);
  const btn = $('check-btn');
  const ready = () => { btn.disabled = !items.every(it => store[it.id] && store[it.id].size > 0); };
  document.querySelectorAll('#prac .item').forEach(el => wireItem(el, store, ready));

  btn.onclick = () => {
    let allRight = true;
    items.forEach(it => {
      const chosen = store[it.id] || new Set();
      const right = [...chosen].sort().join('') === keyOf(it);
      allRight = allRight && right;
      showKey(document.querySelector(`#prac .item[data-id="${CSS.escape(String(it.id))}"]`), it, chosen);
      practiceData.push({ item_id: it.id, response: [...chosen].sort().join(''), correct_answer: keyOf(it), both_correct: right });
    });
    $('prac-fb').innerHTML = `<p class="feedback ${allRight ? 'right' : 'wrong'}">${allRight ? 'That’s right!' : 'Not quite.'}</p>
      ${items.map(it => it.feedback || '').join('')}${pg.feedback || ''}`;
    btn.disabled = false;
    btn.innerHTML = last ? beginLabel() : 'Next &rarr;';
    const go = () => { instIdx++; last ? startPart(0) : showInstPage(); };
    btn.onclick = null;
    last ? onceSpaceOrClick(btn, go) : (btn.onclick = go);
    $('prac-fb').scrollIntoView({ behavior: 'smooth', block: 'center' });
  };
}

// Start something by button click OR spacebar, and make sure it can only fire once.
function onceSpaceOrClick(btn, fn){
  let fired = false;
  const go = () => { if (fired) return; fired = true; document.removeEventListener('keydown', h); fn(); };
  const h = e => { if (e.code === 'Space') { e.preventDefault(); go(); } };
  document.addEventListener('keydown', h);
  btn.addEventListener('click', go);
}

/* ── Test parts ──────────────────────────────── */
/* A part can be split into pages (itemsPerPage). All pages are built at once
   and shown one at a time, so answers stay put when moving back and forth. */
let curPage = 0, nPages = 1;
function pageOf(k){ const per = CFG.parts[partIdx].itemsPerPage || CFG.itemsPerPage; return per ? Math.floor(k / per) : 0; }

function startPart(i){
  partIdx = i; sel = {}; meta = {};
  const part = CFG.parts[i];
  const secs = part.seconds || CFG.partSeconds;
  timerBar.style.display = 'flex';
  nPages = pageOf(part.items.length - 1) + 1;
  const pages = Array.from({ length: nPages }, (_, p) => part.items.filter((_, k) => pageOf(k) === p));
  content.innerHTML = pages.map((items, p) => `<div class="items page" data-page="${p}">
      ${items.map(it => itemHtml(it, it.label || String(it.id))).join('')}
      <div class="page-nav">
        ${p > 0 ? '<button class="btn secondary" data-go="-1">&larr; Previous page</button>' : '<span></span>'}
        <span class="page-of">Page ${p + 1} of ${nPages}</span>
        ${p < nPages - 1 ? '<button class="btn" data-go="1">Next page &rarr;</button>'
                         : '<button class="btn" data-submit="1">Submit &rarr;</button>'}
      </div></div>`).join('');
  content.querySelectorAll('[data-go]').forEach(b => b.onclick = () => showPage(curPage + Number(b.dataset.go)));
  content.querySelectorAll('[data-submit]').forEach(b => b.onclick = () => $('submit-btn').click());
  showPage(0);

  partStartMs = performance.now();
  content.querySelectorAll('.items .item').forEach(el => wireItem(el, sel, id => {
    const t = Math.round(performance.now() - partStartMs);
    const m = meta[id] || (meta[id] = { first_ms: t, last_ms: t, changes: 0 });
    m.last_ms = t; m.changes++;
    updateCount();
  }));
  updateCount();
  $('submit-btn').onclick = () => {
    if (!CFG.confirmEarlySubmit) return endPart(true);
    const what = CFG.parts.length > 1 ? esc(part.label || 'this part') : 'your answers';
    confirmModal(`You still have ${mm_ss(timerSec)} left. Submit ${what} now? You won’t be able to change them afterwards.`,
      () => endPart(true));
  };

  // Timer counts from the real clock, so it stays right even if the tab is in the background.
  const tick = () => {
    timerSec = Math.max(0, secs - Math.floor((performance.now() - partStartMs) / 1000));
    const el = $('timer-display');
    el.textContent = mm_ss(timerSec);
    el.className = timerSec <= CFG.urgentAtSeconds ? 'urgent' : timerSec <= CFG.warnAtSeconds ? 'warn' : '';
    if (timerSec <= 0) { closeModal(); endPart(false); }
  };
  clearInterval(timerInt); tick(); timerInt = setInterval(tick, 250);
}

function showPage(p){
  curPage = p;
  content.querySelectorAll('.page').forEach(el => { el.style.display = Number(el.dataset.page) === p ? '' : 'none'; });
  const part = CFG.parts[partIdx];
  const name = CFG.parts.length > 1 ? (part.label || `Part ${partIdx + 1}`) : '';
  $('part-label').textContent = [name, nPages > 1 ? `Page ${p + 1} of ${nPages}` : ''].filter(Boolean).join(' · ') || part.label || 'Test';
  scrollTo(0, 0);
}

function updateCount(){
  const items = CFG.parts[partIdx].items;
  const n = items.filter(it => sel[it.id] && sel[it.id].size > 0).length;
  $('answered-count').textContent = `${n} / ${items.length} answered`;
}

function endPart(manual){
  clearInterval(timerInt);
  timerBar.style.display = 'none';
  const part = CFG.parts[partIdx];
  const elapsed = Math.round(performance.now() - partStartMs);
  part.items.forEach((it, k) => {
    const chosen = [...(sel[it.id] || [])].sort().join('');
    const key = keyOf(it);
    const hits = [...chosen].filter(l => key.includes(l)).length;
    const fas  = chosen.length - hits;
    const m = meta[it.id] || {};
    allData.push({
      participant_id: pid,
      session: SESSION,
      session_start: sessionStart,
      part: partIdx + 1,
      page: pageOf(k) + 1,
      position: k + 1,
      item_id: it.id,
      response: chosen,                 // e.g. "AC"; empty = no answer
      correct_answer: key,
      n_selected: chosen.length,
      hits,                             // chosen options that are correct
      false_alarms: fas,                // chosen options that are wrong
      both_correct: chosen.length ? (hits === CFG.correctPerItem && fas === 0 ? 1 : 0) : 0,
      answered: chosen.length ? 1 : 0,
      first_click_ms: m.first_ms ?? '',
      last_click_ms: m.last_ms ?? '',
      n_clicks: m.changes || 0,
      part_time_used_ms: elapsed,
      submitted_manually: manual ? 1 : 0,
    });
  });
  partIdx + 1 < CFG.parts.length ? showBreak(partIdx + 1) : showEndScreen();
}

function showBreak(next){
  const done = CFG.parts[next - 1].label || `Part ${next}`;
  const nxt  = CFG.parts[next].label || `Part ${next + 1}`;
  content.innerHTML = `<div class="break-wrap">
    <h2>${esc(done)} Complete</h2>${CFG.breakHtml}
    <p style="margin-top:20px">When you are ready, press <kbd>spacebar</kbd> or click below to begin ${esc(nxt)}.</p>
    <div style="text-align:center;margin-top:28px"><button class="btn" id="begin-btn">Begin ${esc(nxt)} &rarr;</button></div>
  </div>`;
  scrollTo(0, 0);
  onceSpaceOrClick($('begin-btn'), () => startPart(next));
}

/* ── Modal ───────────────────────────────────── */
function confirmModal(text, onYes){
  $('modal-text').innerHTML = text;
  $('modal').style.display = 'flex';
  $('modal-no').onclick = closeModal;
  $('modal-yes').onclick = () => { closeModal(); onYes(); };
}
function closeModal(){ $('modal').style.display = 'none'; }

/* ── Scoring + end ───────────────────────────── */
function partStats(p){
  const rs = allData.filter(r => r.part === p);
  return {
    strict: rs.reduce((a, r) => a + r.both_correct, 0),
    hits:   rs.reduce((a, r) => a + r.hits, 0),
    fas:    rs.reduce((a, r) => a + r.false_alarms, 0),
    answered: rs.reduce((a, r) => a + r.answered, 0),
    n: rs.length,
  };
}

function showEndScreen(){
  const P = CFG.parts.map((_, i) => partStats(i + 1));
  const T = P.reduce((a, s) => ({ strict: a.strict + s.strict, hits: a.hits + s.hits, fas: a.fas + s.fas,
                                  answered: a.answered + s.answered, n: a.n + s.n }),
                     { strict: 0, hits: 0, fas: 0, answered: 0, n: 0 });

  // Compact results for Qualtrics: each key becomes one embedded-data field.
  // "responses" = every item's answer in order, separated by "|" ("-" = no answer).
  const summary = {
    responses: allData.map(r => r.response || '-').join('|'),
    strict: T.strict, hits: T.hits, false_alarms: T.fas, answered: T.answered,
  };
  if (P.length > 1) P.forEach((s, i) => { summary[`p${i+1}_strict`] = s.strict; summary[`p${i+1}_hits`] = s.hits; summary[`p${i+1}_false_alarms`] = s.fas; });

  if (EMBEDDED) {
    postToParent(summary);
    content.innerHTML = '<div class="end-wrap"><p style="color:#888;font-size:15px">Saving your responses&hellip;</p></div>';
    return;
  }

  const one = P.length === 1;
  const head = one ? '' : `<tr><td></td>${P.map((_, i) => `<td style="font-weight:700;color:#555">${esc(CFG.parts[i].label || 'Part ' + (i+1))}</td>`).join('')}<td style="font-weight:700;color:#555">Total</td></tr>`;
  const row = (name, k) => `<tr><td>${name}</td>${one ? '' : P.map(s => `<td>${s[k]}</td>`).join('')}<td><b>${T[k]}</b></td></tr>`;
  content.innerHTML = `<div class="end-wrap">
    <h2>Test Complete</h2>
    ${CFG.showScoreAtEnd ? `<div class="score-card">
      <div class="score-big">${T.strict} / ${T.n}</div>
      <table>${head}
        ${row('Items with both correct figures chosen', 'strict')}
        ${row('Correct figures chosen', 'hits')}
        ${row('Wrong figures chosen', 'fas')}
        ${row('Items answered', 'answered')}
      </table></div>` : ''}
    <p style="color:#888;font-size:14px;margin-bottom:20px">Your data has been downloaded automatically.</p>
    <button class="btn" onclick="downloadCSV()">Download Data Again (CSV)</button>
  </div>`;
  setTimeout(downloadCSV, 200);
}

/* Message format shared by every task: {type, task, data}.
   Contains only scores/answers (no ID), so '*' is safe here. */
let _sent = false;
function postToParent(data){
  if (_sent || window.parent === window) return;
  _sent = true;
  window.parent.postMessage({ type: 'task_complete', task: CFG.taskName, data }, '*');
}

function downloadCSV(){
  if (!allData.length) return;
  const keys = Object.keys(allData[0]);
  const cell = v => {
    if (v === null || v === undefined) return '';
    const s = String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = [keys.join(','), ...allData.map(r => keys.map(k => cell(r[k])).join(','))].join('\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: `${CFG.taskName}_${pid}_${Date.now()}.csv` });
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

/* ── Check view (?check=1, only on your own computer) ──────────────
   Shows every practice and test item with its answer key in green,
   and lists problems with the config, so you can verify your setup. */
function showCheck(missing){
  $('pre-experiment').style.display = 'none';
  $('main').style.display = 'block';
  const problems = [];
  const seen = new Set();
  [...CFG.practice, ...allItems()].forEach(it => {
    const k = keyOf(it), where = `Item “${it.id}”`;
    if (seen.has(String(it.id))) problems.push(`${where}: the same id is used twice.`);
    seen.add(String(it.id));
    if (k.length !== CFG.correctPerItem) problems.push(`${where}: answer has ${k.length} letter(s), expected ${CFG.correctPerItem}.`);
    if ([...k].some(l => !CFG.letters.includes(l))) problems.push(`${where}: answer uses a letter outside ${CFG.letters}.`);
    if (!it.image && (it.options || []).length !== CFG.letters.length) problems.push(`${where}: has ${(it.options||[]).length} option pictures, expected ${CFG.letters.length}.`);
  });
  missing.forEach(f => problems.push(`Missing picture: ${src(f)}`));
  const section = (title, items) => `<div class="check-head"><h2>${esc(title)}</h2></div>
    <div class="items">${items.map(it => itemHtml(it, `${it.label || it.id}   ·   answer: ${keyOf(it)}`)).join('')}</div>`;
  content.innerHTML = `<div class="check-head"><h2>Answer key check</h2>
      <p>Correct options are outlined in green. This view only opens on your own computer.</p>
      ${problems.length ? problems.map(p => `<p class="check-problem">${esc(p)}</p>`).join('') : '<p style="color:#2e8b57;font-weight:700">No problems found in the config.</p>'}
    </div>
    ${CFG.practice.length ? section('Practice items', CFG.practice) : ''}
    ${CFG.parts.map((p, i) => section(p.label || `Part ${i+1}`, p.items)).join('')}`;
  const all = [...CFG.practice, ...allItems()];
  document.querySelectorAll('.item').forEach(el => {
    const it = all.find(x => String(x.id) === el.dataset.id);
    if (it) showKey(el, it, null);
  });
}

/* ── Light deterrents against saving the pictures ──────────────────
   (These stop casual right-click saving only; anything shown in a browser
   can still be captured. See README.) */
document.addEventListener('contextmenu', e => { if (e.target.closest('.item, .inst-wrap')) e.preventDefault(); });
document.addEventListener('dragstart', e => { if (e.target.tagName === 'IMG') e.preventDefault(); });

/* ── Launch ──────────────────────────────────── */
document.title = CFG.title;
$('pre-title').textContent = CFG.title;
{
  const mins = p => Math.round((p.seconds || CFG.partSeconds) / 60);
  const nItems = CFG.parts.reduce((a, p) => a + p.items.length, 0);
  $('pre-sub').innerHTML = (CFG.parts.length > 1
      ? `${CFG.parts.length} parts &ndash; ${mins(CFG.parts[0])} minutes each`
      : `${nItems} problems &ndash; ${mins(CFG.parts[0])} minutes`) + '<br>Enter the Participant ID to begin.';
}
if (CFG.demo) document.body.insertAdjacentHTML('beforeend',
  '<div id="demo-banner">Demo version with placeholder pictures. Add your own config.js and stimuli to run the real test (see README).</div>');

const pidInput = $('pid-input'), startBtn = $('start-btn');
const loaded = preloadAll();

const launch = () => {
  pid = pidInput.value.trim();
  if (!pid) { pidInput.classList.add('error'); pidInput.focus(); return; }
  startBtn.disabled = true;
  loaded.then(() => {
    sessionStart = new Date().toISOString();
    $('pre-experiment').style.display = 'none';
    $('main').style.display = 'block';
    showInstructions();
  });
};
startBtn.addEventListener('click', launch);
pidInput.addEventListener('keydown', e => { if (e.key === 'Enter') launch(); });
pidInput.addEventListener('input', () => pidInput.classList.remove('error'));

if (CHECK) loaded.then(showCheck);
else if (URL_PID || EMBEDDED) {
  // ID came from the URL (e.g. Qualtrics): never show the ID screen, just a loading
  // message while the pictures load (they can take a moment on a slow connection).
  pidInput.value = URL_PID || 'unknown';
  document.querySelector('.pre-card').innerHTML = '<p id="load-msg" style="margin:0">Loading&hellip;</p>';
  launch();
}
</script>
